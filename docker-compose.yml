      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9094,1@kafka-1:9094,2@kafka-2:9094
      - KAFKA_KRAFT_MODE=true
      - KAFKA_KRAFT_CLUSTER_ID=1d14cbea-6d9e-4e9a-8f62-66f5c8f2b1f1
      # Listeners
